<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Customer Management System</h1>

    <div class="form-group">
        <input type="text" placeholder="Customer ID" id="txtCustomerId">
        <input type="text" placeholder="Customer Name" id="txtCustomerName">
        <input type="number" placeholder="Customer Age" id="txtCustomerAge">
        <input type="text" placeholder="Customer Address" id="txtCustomerAddress">
    </div>

    <hr>

    <div class="button-group">
        <input type="button" value="Add Customer" onclick="btnAddCustomerOnAction()">
        <input type="button" value="Search By ID" onclick="btnSearchByIdOnAction()">
        <input type="button" value="Delete By ID" onclick="btnDeleteByIdOnAction()">
        <input type="button" value="Update By ID" onclick="btnUpdateByIdOnActio()">
        <input type="button" value="Clear Storage" onclick="btnClearStorageOnAction()">
        <input type="button" value="Load Table" onclick="btnLoadTableOnAction()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Customer ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Address</th>
                </tr>
            </thead>

            <tbody id="customerTableBody">

            </tbody>
        </table>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
